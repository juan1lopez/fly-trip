[project]
name = "flytrip"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "httpx",
    "pydantic>=2",
    "typer",
    "rich",
    "flights==0.9.0",
    "tzdata",
]

[project.scripts]
fly = "flytrip.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "pytest-socket",
    "pytest-playwright",
    "ruff",
    "mypy",
    "import-linter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flytrip"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m \"not live\""
markers = [
    "live: sale a internet",
    "e2e: usa el navegador",
]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["flytrip.core.*", "flytrip.engine.*"]
strict = true

[[tool.mypy.overrides]]
module = ["fli", "fli.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "flytrip"

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "flytrip.cli",
    "flytrip.web",
    "flytrip.engine",
    "flytrip.sources",
    "flytrip.core",
]

[[tool.importlinter.contracts]]
name = "Devtools stay out of the app"
type = "forbidden"
source_modules = [
    "flytrip.core",
    "flytrip.sources",
    "flytrip.engine",
    "flytrip.web",
]
forbidden_modules = ["flytrip.devtools"]
